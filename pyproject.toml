[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.0.2",
    "ruff>=0.15.4",
    "streamlit>=1.54.0",
    "tabulate>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pandas>=2.0",
    "plotly>=5.0",
    "sqlalchemy>=2.0",
    "tabulate>=0.9",
    "python-dotenv>=1.0",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "ruff==0.15.4",
    "streamlit==1.54.0",
    "streamlit==1.54.0",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    
]
